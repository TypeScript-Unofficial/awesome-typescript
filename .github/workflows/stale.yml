name: Stale

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close stale issues and pull requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 90
          days-before-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity. It will be closed if no further activity occurs.
            Thank you for your contributions.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had recent activity. It will be closed if no further activity
            occurs. Please update it or let us know if it is still in progress.
          close-issue-message: >
            This issue was closed because it has been inactive for a while. Feel
            free to reopen it if the problem persists.
          close-pr-message: >
            This pull request was closed because it has been inactive for a while.
            Please reopen it if you would like to continue working on it.
