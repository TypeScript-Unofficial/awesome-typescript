name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis: type-check, validate source data, lint, and format.
  # ---------------------------------------------------------------------------
  check:
    name: Type-check, validate, lint, and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Validate source data
        run: npm run validate

      - name: Lint markdown
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

  # ---------------------------------------------------------------------------
  # Tests.
  # ---------------------------------------------------------------------------
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------------------
  # Generated output: regenerate the README and fail if it differs from the
  # committed version, so the source of truth and the public list never drift.
  # ---------------------------------------------------------------------------
  generate:
    name: Verify generated README is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate README
        run: npm run generate

      - name: Fail if generated output differs from committed output
        run: |
          if ! git diff --exit-code README.md; then
            echo "::error::README.md is out of sync. Run 'npm run generate' and commit the result."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # EditorConfig conformance.
  # ---------------------------------------------------------------------------
  editorconfig:
    name: Check EditorConfig conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: editorconfig-checker/action-editorconfig-checker@v2
      - run: editorconfig-checker
