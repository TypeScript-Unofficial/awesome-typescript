name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Validate, lint, test, and check generated output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Validate source data
        run: npm run validate

      - name: Lint markdown
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Regenerate README
        run: npm run generate

      - name: Fail if generated output differs from committed output
        run: |
          if ! git diff --exit-code README.md; then
            echo "::error::README.md is out of sync. Run 'npm run generate' and commit the result."
            exit 1
          fi
